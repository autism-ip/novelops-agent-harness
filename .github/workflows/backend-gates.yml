name: Backend Behavior Gates

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

jobs:
  backend-behavior:
    name: ZEN-28 behavior contract
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend with test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run behavior gates
        env:
          BACKEND_API_KEY: ci-contract-key
        run: python -m pytest tests -q --tb=short
