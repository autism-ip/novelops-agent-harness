[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "novelops-backend"
version = "0.1.0"
description = "Local FastAPI backend harness for NovelOps Agent Team workflows."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136.0",
  "pydantic-settings>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
