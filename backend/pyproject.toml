[project]
name = "novelops-backend"
version = "0.1.0"
description = "NovelOps Agent Harness Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "lark-oapi>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
    "build==1.6.1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Explicit project rules keep local and CI results independent of user config.
select = ["E4", "E7", "E9", "F", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
markers = [
    "integration: tests that require real Feishu credentials (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Baseline at 808167e: 800 / 911 application statements (169 offline tests).
# Raise with improved coverage; do not lower this to make a change pass.
# Use the exact measured percentage; 87.82 is its rounded display value.
fail_under = 87.81558726673984
precision = 2
show_missing = true

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
app = ["fixtures/*.json"]
